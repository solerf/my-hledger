version = "3.11.1"
runner.dialect = scala3

# Scala 2-style formatting: keep braces, no significant indentation, no
# automatic conversion to Scala 3 syntax.
rewrite.scala3.convertToNewSyntax = false
rewrite.scala3.removeOptionalBraces = no
rewrite.scala3.insertEndMarkerMinLines = 0

maxColumn = 100
indent.main = 2
indent.callSite = 2
indent.defnSite = 2

align.preset = more
align.openParenCallSite = false
align.openParenDefnSite = false

# When params/args wrap, indent by indent.{defn,call}Site (2) instead of
# aligning under the opening paren, and put the closing paren on its own line.
danglingParentheses.defnSite = true
danglingParentheses.callSite = true

newlines.source = keep
newlines.topLevelStatementBlankLines = [
  { blanks { before = 1 } }
]

docstrings.style = SpaceAsterisk
docstrings.wrap = no

rewrite.rules = [
  RedundantBraces,
  RedundantParens,
  SortModifiers
]
rewrite.redundantBraces.stringInterpolation = true

project.excludePaths = [
  "glob:**/target/**",
  "glob:**/project/target/**"
]
