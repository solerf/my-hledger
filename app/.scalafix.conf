rules = [
  OrganizeImports
]

# Scalafix support on Scala 3 is narrower than on Scala 2 — most rewrite rules
# (e.g. ExplicitResultTypes, RedundantSyntheticCase) are not available yet.
# Keep this list minimal and add rules only after confirming they work on 3.x.
OrganizeImports {
  targetDialect = Scala3
  groupedImports = Merge
  removeUnused = true
  groups = [
    "java.",
    "scala.",
    "*",
    "re:(javax?|sun)\\."
  ]
}
