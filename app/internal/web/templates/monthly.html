{{define "content"}}
<div>
    <div class="month-selector mb-3">
        <form method="get" action="/monthly">
            <label class="form-label" for="month-select">Month</label>
            <select id="month-select" class="form-select" name="month" onchange="this.form.submit()">
                {{range .Months}}
                <option value="{{.}}"{{if eq . $.SelectedMonth}} selected{{end}}>{{.}}</option>
                {{end}}
            </select>
        </form>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h5 class="card-title">Expenses</h5>
                    <div class="chart-wrap chart-wrap-pie">
                        <canvas id="chart-pie-expenses" width="480" height="360"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h5 class="card-title">Liabilities</h5>
                    <div class="chart-wrap chart-wrap-pie">
                        <canvas id="chart-pie-liabilities" width="480" height="360"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h5 class="card-title">By account, by date</h5>
                    <div class="chart-wrap">
                        <canvas id="chart-accounts-line" width="960" height="360"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h5 class="card-title">Cumulative</h5>
                    <div class="chart-wrap">
                        <canvas id="chart-line" width="960" height="360"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="table-responsive entries-scroll">
        <table class="table table-striped table-sm align-middle w-100">
            <thead class="table-light">
            <tr>
                <th>Date</th>
                <th>Account</th>
                <th>Amount</th>
            </tr>
            </thead>
            <tbody>
            {{range .Table}}
            <tr class="table-secondary">
                <td colspan="3"><strong>{{.Date}}</strong></td>
            </tr>
            {{range .Groups}}
            <tr>
                <td class="text-end fst-italic">{{.Header}}</td>
                <td></td>
                <td class="amount-num{{if .IsExpense}} text-danger{{end}}">{{.Sum}}</td>
            </tr>
            {{range .Entries}}
            <tr>
                <td></td>
                <td class="fst-italic">{{.Label}}</td>
                <td class="amount-num{{if .IsExpense}} text-danger{{end}}">{{.Amount}}</td>
            </tr>
            {{end}}
            {{end}}
            {{end}}
            </tbody>
        </table>
    </div>
</div>
<script>window.__CHARTS__ = {{.Charts}};</script>
<script src="/js/charts.js" defer></script>
{{end}}
