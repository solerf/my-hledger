{{define "content"}}
<div>
    <datalist id="accounts-list">
        {{range .Accounts}}<option value="{{.}}"></option>{{end}}
    </datalist>

    <form id="entry-form" class="mb-3">
        <div class="row g-3 align-items-end">
            <div class="col-12 col-md-3">
                <label class="form-label">Date</label>
                <input type="date" class="form-control" name="date"/>
            </div>
            <div class="col-12 col-md-3">
                <label class="form-label">From</label>
                <input type="text" class="form-control" name="from" list="accounts-list"
                       placeholder="account:sub"/>
            </div>
            <div class="col-12 col-md-3">
                <label class="form-label">To</label>
                <input type="text" class="form-control" name="to" list="accounts-list"
                       placeholder="account:sub"/>
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label">Amount</label>
                <input type="number" step="0.01" placeholder="0.00" class="form-control text-end"
                       name="amount"/>
            </div>
            <div class="col-6 col-md-1">
                <label class="form-label">Currency</label>
                <input type="text" class="form-control text-uppercase" placeholder="EUR"
                       name="currency" value="EUR"/>
            </div>
            <div class="col-12 col-md-6">
                <label class="form-label">Description</label>
                <input type="text" class="form-control" name="description"/>
            </div>
            <div class="col-12 col-md-6">
                <label class="form-label">Comment</label>
                <input type="text" class="form-control" name="comment"/>
            </div>
        </div>
        <div class="d-flex justify-content-end mt-3">
            <button type="submit" class="btn btn-outline-primary">Add</button>
        </div>
    </form>

    <div id="feedback"></div>

    <div class="table-responsive entries-scroll">
        <table class="table table-striped table-sm align-middle w-100">
            <thead class="table-light">
            <tr>
                <th>Date</th>
                <th>From</th>
                <th>To</th>
                <th class="text-end">Amount</th>
                <th>Currency</th>
                <th>Description</th>
                <th>Comment</th>
                <th></th>
            </tr>
            </thead>
            <tbody id="pending-body"></tbody>
        </table>
    </div>

    <div class="d-flex justify-content-end mt-2">
        <button type="button" id="save-btn" class="btn btn-primary" disabled>Save 0 entries</button>
    </div>
</div>
<script src="/js/manual.js" defer></script>
{{end}}
